#workflow
name: cicd

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      -name: clone the code
        run: echo "clonning the code"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps: 
      -name: build the image
        run: echo "building the image"
  test:
